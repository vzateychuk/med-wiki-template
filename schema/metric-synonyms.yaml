# Канон показателей лаборатории: несколько названий → один slug.
# Читает resolve_metric_slug.py. Правьте только этот файл.
#
# Формат:
# - slug: каноническое имя файла wiki/metrics/<slug>.md
#   title: человекочитаемое название (для _index и шапки)
#   value_kind: numeric | qualitative | panel-item
#   synonyms: список строк как в документах (любой регистр при сравнении)
#
# Правила (анти-склейка):
# 1. Сопоставление ТОЛЬКО точное (после normalize). Не полагайтесь на «похоже».
# 2. Ratio / % / абсолют / разные биоматериалы — РАЗНЫЕ slug
#    (aptt vs aptt-ratio; neutrophils-abs vs neutrophils-pct; wbc vs wbc-urine).
# 3. Не добавляйте короткий синоним, который является подстрокой другого показателя
#    (запрещено: «Гемоглобин» ловит MCH; «Холестерин» ловит ЛПНП — для ЛПНП
#    нужен отдельный полный синоним «Холестерин ЛПНП»).
# 4. После правок: python resolve_metric_slug.py --self-check
# 5. Имена/slug из других wiki (например medocs-wiki) добавляй как synonyms
#    на НАШ канонический slug (glucose → fasting-glucose, hdl-cholesterol → hdl).
#    Не плоди второй slug ради чужого имени файла.

